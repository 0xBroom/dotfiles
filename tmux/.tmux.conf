# ═══════════════════════════════════════════════════════════
#  ~/.tmux.conf — setup productivo
# ═══════════════════════════════════════════════════════════

# ── Prefix ─────────────────────────────────────────────────
# Cambiamos Ctrl-b por Ctrl-Space (más ergonómico)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── General ────────────────────────────────────────────────
set -g mouse on                      # mouse: seleccionar panes, resize, scroll
set -g base-index 1                  # ventanas empiezan en 1, no en 0
setw -g pane-base-index 1            # panes empiezan en 1
set -g renumber-windows on           # renumera al cerrar una ventana
set -g history-limit 50000           # más scrollback
set -sg escape-time 0                # sin delay al apretar ESC (clave para vim)
set -g focus-events on               # avisa a vim/nvim cuando cambia el foco
set -g set-clipboard on              # integra con el portapapeles del sistema

# ── True color ─────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ── Recarga rápida de config ───────────────────────────────
# prefix + r  →  recarga este archivo sin salir de tmux
bind r source-file ~/.tmux.conf \; display "Config recargada ✔"

# ── Splits intuitivos ──────────────────────────────────────
# | divide vertical, - divide horizontal; ambos abren en el cwd actual
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# nuevas ventanas también heredan el cwd
bind c new-window -c "#{pane_current_path}"

# ── Navegación de panes estilo vim (prefix + h/j/k/l) ──────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Resize de panes (prefix + H/J/K/L, repetible) ──────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode estilo vim ───────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ═══════════════════════════════════════════════════════════
#  Plugins (gestionados por TPM)
# ═══════════════════════════════════════════════════════════
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # defaults razonables
set -g @plugin 'christoomey/vim-tmux-navigator'  # Ctrl-h/j/k/l entre vim y tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'     # guardar/restaurar sesiones
set -g @plugin 'tmux-plugins/tmux-continuum'     # autoguardado de sesiones
set -g @plugin 'catppuccin/tmux'                 # tema

# Autoguardado y restauración automática al iniciar tmux
set -g @continuum-restore 'on'

# ── Inicializar TPM (debe ser la ÚLTIMA línea) ─────────────
run '~/.tmux/plugins/tpm/tpm'
